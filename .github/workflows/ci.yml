name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check backend tests scripts --select E9,F63,F7,F82
      - run: uv run pytest -q
        env:
          LIBRARY_DIR: /tmp/research-test-library
          EVIDENCE_ENRICHMENT: '0'
