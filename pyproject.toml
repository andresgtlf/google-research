[project]
name = "google-research"
version = "0.5.0"
description = "GTLF Research - AI-powered concept note analysis (multi-provider deep research)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.0.0",
    "google-cloud-storage>=3.4.0,<4",
    "openai>=2.7.0",
    "anthropic>=0.75.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
